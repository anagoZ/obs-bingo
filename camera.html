<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ビンゴ カメラ送信</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
  :root{--bg:#0e1124;--panel:#171c38;--line:#2a3160;--accent:#ffcc33;--ok:#3fd68a;--ng:#ff4d6d;--text:#fff;--dim:#9aa0d0;
    --B:#3fa7ff;--I:#ff5e7e;--N:#c9c9d6;--G:#3fd68a;--O:#ffb13f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;-webkit-text-size-adjust:100%}
  body{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  header{padding:12px 16px;font-weight:900;font-size:18px;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
  header span{color:var(--accent)}
  #preview{position:relative;height:30vh;min-height:180px;background:#000;display:flex;align-items:center;justify-content:center}
  #preview video{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}
  #preview .ph{color:var(--dim);font-size:14px;padding:16px;text-align:center}
  #status{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:14px;background:var(--panel)}
  #dot{width:12px;height:12px;border-radius:50%;background:var(--dim);flex:none}
  #dot.ok{background:var(--ok)} #dot.ng{background:var(--ng)} #dot.wait{background:var(--accent)}

  /* 数字入力 */
  #pad{padding:12px 16px 4px;transition:opacity .2s}
  #pad.off{opacity:.35;pointer-events:none}
  .now{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .now .last{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim)}
  .now .ball{min-width:56px;height:40px;padding:0 10px;border-radius:20px;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:22px;background:var(--panel);border:3px solid var(--line)}
  .now .count{margin-left:auto;font-size:14px;color:var(--dim)}
  .now .count b{color:var(--accent);font-size:20px}
  #entry{height:64px;border-radius:14px;background:#0a0d1c;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
    gap:12px;font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;margin-bottom:10px}
  #entry .ltr{font-size:24px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0e1124}
  #entry .placeholder{font-size:16px;font-weight:400;color:var(--dim)}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .keys button{height:58px;font-size:28px;font-weight:800}
  .keys .enter{background:var(--accent);border-color:var(--accent);color:#0e1124;font-size:20px}
  .sub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .sub button{font-size:15px;padding:12px}
  .sub .armed{border-color:var(--ng);color:var(--ng)}
  #msg{min-height:22px;font-size:14px;color:var(--accent);text-align:center;margin-top:8px}

  details{margin:8px 16px 16px;background:var(--panel);border-radius:14px;padding:4px 14px}
  summary{padding:10px 0;font-size:15px;font-weight:700;cursor:pointer}
  .controls{display:flex;flex-direction:column;gap:12px;padding:4px 0 14px}
  label{font-size:12px;color:var(--dim);display:block;margin-bottom:6px}
  .row{display:flex;gap:10px}
  .row > *{flex:1}
  input,select{width:100%;font:inherit;font-size:22px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);
    background:#0a0d1c;color:#fff;letter-spacing:.15em;text-align:center}
  select{font-size:16px;letter-spacing:0}
  button{font:inherit;font-size:16px;font-weight:700;padding:12px;border-radius:14px;border:2px solid var(--line);
    background:var(--panel);color:#fff;touch-action:manipulation}
  button:active{filter:brightness(1.3)}
  #go{background:var(--accent);border-color:var(--accent);color:#0e1124;font-size:17px;padding:14px}
  #go.stop{background:var(--ng);border-color:var(--ng);color:#fff}
  button:disabled{opacity:.5}
  .note{font-size:12px;color:var(--dim);line-height:1.6}
</style>
</head>
<body>
<header><div><span>BINGO</span> カメラ＆入力</div></header>

<div id="preview"><div class="ph">下の「接続」から「カメラ開始」を押してください</div></div>
<div id="status"><div id="dot"></div><div id="statusText">待機中</div></div>

<div id="pad" class="off">
  <div class="now">
    <div class="last">今の番号 <div class="ball" id="lastBall">-</div></div>
    <div class="count"><b id="count">0</b> 個目</div>
  </div>
  <div id="entry"><span class="placeholder">数字を押して「表示」</span></div>
  <div class="keys">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="del">⌫</button><button data-k="0">0</button><button data-k="ok" class="enter">表示</button>
  </div>
  <div class="sub">
    <button id="undo">直前を取り消し</button>
    <button id="reset">リセット</button>
  </div>
  <div id="msg"></div>
</div>

<details id="setup" open>
  <summary>接続</summary>
  <div class="controls">
    <div>
      <label>接続コード（OBSのビンゴ画面の設定に出ている6桁）</label>
      <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="off">
    </div>
    <div class="row">
      <div>
        <label>画質</label>
        <select id="quality">
          <option value="1280x720">720p（おすすめ）</option>
          <option value="1920x1080">1080p（高画質）</option>
          <option value="640x480">480p（軽い）</option>
        </select>
      </div>
      <div>
        <label>カメラ</label>
        <button id="flip" style="width:100%">外カメラ</button>
      </div>
    </div>
    <button id="go">カメラ開始</button>
    <div class="note">
      スマホとPCを同じWi-Fiにつないでください。配信中はこの画面を開いたままにしてください（スリープしないようにしています）。
    </div>
  </div>
</details>

<script>
const $ = id => document.getElementById(id);
const CODE_KEY = "obs-bingo-cam-code";
const PREFIX = "obsbingo-";
const MAX = 75, LETTERS = ["B","I","N","G","O"];
const COLORS = {B:"var(--B)",I:"var(--I)",N:"var(--N)",G:"var(--G)",O:"var(--O)"};
const letterOf = n => LETTERS[Math.floor((n-1)/15)];
let stream = null, peer = null, call = null, data = null;
let running = false, facing = "environment", retryTimer = null, wakeLock = null;
let entry = "", drawn = [], resetArmed = 0;

// コード：URL ?code= → 前回の値
const qCode = new URLSearchParams(location.search).get("code");
try{ $("code").value = (qCode && /^\d{6}$/.test(qCode)) ? qCode : (localStorage.getItem(CODE_KEY) || ""); }catch(e){ if(qCode) $("code").value = qCode; }
$("code").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g,"").slice(0,6); });

function setStatus(text, state){ $("statusText").textContent = text; $("dot").className = state || ""; }
let msgTimer;
function flash(text){ $("msg").textContent = text; clearTimeout(msgTimer); msgTimer = setTimeout(()=>{ $("msg").textContent = ""; }, 2500); }

// ---- 数字入力 ----
function drawEntry(){
  const e = $("entry");
  if(!entry){ e.innerHTML = '<span class="placeholder">数字を押して「表示」</span>'; return; }
  const n = parseInt(entry, 10);
  const L = n>=1 && n<=MAX ? letterOf(n) : null;
  e.innerHTML = (L ? `<span class="ltr" style="background:${COLORS[L]}">${L}</span>` : "") + `<span>${entry}</span>`;
}
function drawState(){
  const last = drawn[drawn.length-1];
  const b = $("lastBall");
  b.textContent = last ? `${letterOf(last)} ${last}` : "-";
  b.style.borderColor = last ? COLORS[letterOf(last)] : "var(--line)";
  $("count").textContent = drawn.length;
}
function send(msg){
  if(data && data.open){ data.send(msg); return true; }
  flash("ビンゴ画面とつながっていません"); return false;
}
document.querySelectorAll(".keys button").forEach(btn => btn.addEventListener("click", () => {
  const k = btn.dataset.k;
  if(k === "del"){ entry = entry.slice(0,-1); }
  else if(k === "ok"){
    if(!entry) return;
    const n = parseInt(entry, 10);
    if(!(n>=1 && n<=MAX)){ flash(`1〜${MAX}で入力してね`); entry = ""; drawEntry(); return; }
    if(drawn.includes(n)){ flash(`${n} はもう出ています`); entry = ""; drawEntry(); return; }
    if(send({type:"add", n})){ entry = ""; if(navigator.vibrate) navigator.vibrate(30); }
  }
  else if(entry.length < 2){ entry = (entry === "0" ? "" : entry) + k; }
  drawEntry();
}));
$("undo").onclick = () => { if(!drawn.length){ flash("取り消す番号がありません"); return; } send({type:"undo"}); };
$("reset").onclick = () => {
  const now = Date.now();
  if(now - resetArmed < 3000){ resetArmed = 0; $("reset").classList.remove("armed"); $("reset").textContent = "リセット"; send({type:"reset"}); }
  else{
    resetArmed = now; $("reset").classList.add("armed"); $("reset").textContent = "もう一度押すとリセット";
    setTimeout(() => { if(Date.now() - resetArmed >= 3000){ $("reset").classList.remove("armed"); $("reset").textContent = "リセット"; } }, 3100);
  }
};
function setPad(on){ $("pad").classList.toggle("off", !on); }

// ---- カメラ ----
async function openCamera(){
  const [w,h] = $("quality").value.split("x").map(Number);
  const s = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ideal:facing}, width:{ideal:w}, height:{ideal:h}, frameRate:{ideal:30} },
    audio:false
  });
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = s;
  let v = $("preview").querySelector("video");
  if(!v){
    $("preview").innerHTML = "";
    v = document.createElement("video"); v.autoplay = true; v.muted = true; v.playsInline = true;
    $("preview").appendChild(v);
  }
  v.srcObject = stream;
  const sender = call?.peerConnection?.getSenders().find(x => x.track && x.track.kind === "video");
  if(sender) await sender.replaceTrack(stream.getVideoTracks()[0]);
}

// ---- 接続 ----
function scheduleRetry(msg){
  if(!running) return;
  setStatus(msg + "（3秒後に再接続）", "ng");
  setPad(false);
  clearTimeout(retryTimer);
  retryTimer = setTimeout(connect, 3000);
}
function openData(target){
  if(data){ try{ data.close(); }catch(e){} }
  const d = data = peer.connect(target, {reliable:true});
  d.on("open", () => { if(data === d){ setPad(true); setStatus("配信中", "ok"); } });
  d.on("data", m => {
    if(data !== d || !m || typeof m !== "object") return;
    if(m.type === "state" && Array.isArray(m.drawn)){ drawn = m.drawn; drawState(); }
    else if(m.type === "msg" && m.text) flash(m.text);
  });
  d.on("close", () => { if(data === d){ setPad(false); } });
}
function connect(){
  if(!running) return;
  clearTimeout(retryTimer);
  const target = PREFIX + $("code").value;
  if(!peer || peer.destroyed){
    setStatus("サーバーに接続中…", "wait");
    peer = new Peer();
    peer.on("open", () => connect());
    peer.on("error", err => {
      if(err.type === "peer-unavailable") scheduleRetry("ビンゴ画面が見つかりません。コードとOBSを確認してください");
      else if(["network","server-error","socket-error","socket-closed","disconnected"].includes(err.type)){
        try{ peer.destroy(); }catch(e){}
        scheduleRetry("サーバーにつながりません");
      } else scheduleRetry("エラー：" + err.type);
    });
    peer.on("disconnected", () => { try{ peer.reconnect(); }catch(e){} });
    return;
  }
  if(!peer.open) return;
  if(call){ try{ call.close(); }catch(e){} call = null; }
  setStatus("ビンゴ画面につないでいます…", "wait");
  const c = peer.call(target, stream);
  if(!c){ scheduleRetry("接続できませんでした"); return; }
  call = c;
  openData(target);
  const pc = c.peerConnection;
  const onState = () => {
    if(call !== c) return;
    const st = pc.iceConnectionState;
    if(st === "connected" || st === "completed") setStatus("配信中", "ok");
    else if(st === "failed" || st === "closed") scheduleRetry("接続が切れました");
    else if(st === "disconnected"){
      setStatus("通信が不安定です…", "wait");
      setTimeout(() => { if(call === c && pc.iceConnectionState === "disconnected") scheduleRetry("接続が切れました"); }, 5000);
    }
  };
  if(pc) pc.addEventListener("iceconnectionstatechange", onState);
  c.on("close", () => { if(call === c) scheduleRetry("ビンゴ画面が切断しました"); });
  c.on("error", () => { if(call === c) scheduleRetry("接続エラー"); });
}

async function keepAwake(){
  try{ if("wakeLock" in navigator && running && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") keepAwake(); });

async function start(){
  const code = $("code").value;
  if(!/^\d{6}$/.test(code)){ setStatus("6桁の接続コードを入れてください", "ng"); $("code").focus(); return; }
  if(!window.Peer){ setStatus("接続ライブラリを読み込めませんでした。通信状況を確認してページを再読み込みしてください", "ng"); return; }
  if(!navigator.mediaDevices?.getUserMedia){ setStatus("このブラウザではカメラが使えません（https で開いているか確認）", "ng"); return; }
  try{ localStorage.setItem(CODE_KEY, code); }catch(e){}
  $("go").disabled = true;
  try{ await openCamera(); }
  catch(e){ setStatus("カメラを開けませんでした。ブラウザのカメラ許可を確認してください", "ng"); $("go").disabled = false; return; }
  running = true;
  $("go").disabled = false; $("go").textContent = "停止"; $("go").classList.add("stop");
  $("code").disabled = true;
  $("setup").open = false;   // 入力パッドを広く使えるように閉じる
  keepAwake();
  connect();
}

function stop(){
  running = false; clearTimeout(retryTimer);
  if(data){ try{ data.close(); }catch(e){} data = null; }
  if(call){ try{ call.close(); }catch(e){} call = null; }
  if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
  try{ wakeLock?.release(); }catch(e){}
  setPad(false);
  $("preview").innerHTML = '<div class="ph">停止しました</div>';
  $("go").textContent = "カメラ開始"; $("go").classList.remove("stop");
  $("code").disabled = false;
  setStatus("停止中", "");
}

$("go").onclick = () => running ? stop() : start();
$("flip").onclick = async () => {
  facing = facing === "environment" ? "user" : "environment";
  $("flip").textContent = facing === "environment" ? "外カメラ" : "内カメラ";
  if(stream){ try{ await openCamera(); }catch(e){ setStatus("カメラを切り替えられませんでした", "ng"); } }
};
$("quality").onchange = async () => { if(stream){ try{ await openCamera(); }catch(e){ setStatus("画質を変更できませんでした", "ng"); } } };
drawEntry(); drawState();
</script>
</body>
</html>

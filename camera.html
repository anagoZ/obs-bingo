<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1124">
<title>ビンゴ カメラ＆入力</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
  :root{--bg:#0e1124;--panel:#171c38;--panel2:#1d2347;--line:#2a3160;--accent:#ffcc33;--ok:#3fd68a;--ng:#ff4d6d;--text:#fff;--dim:#9aa0d0;
    --B:#3fa7ff;--I:#ff5e7e;--N:#c9c9d6;--G:#3fd68a;--O:#ffb13f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overscroll-behavior:none;
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;-webkit-text-size-adjust:100%}
  button{font:inherit;font-weight:700;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:#fff;
    touch-action:manipulation;cursor:pointer}
  button:active{filter:brightness(1.35)}
  button:disabled{opacity:.4}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .screen.show{display:flex}

  /* ===== 開始画面 ===== */
  #setup{overflow-y:auto}
  .setup-inner{width:100%;max-width:440px;margin:auto;padding:24px 20px;display:flex;flex-direction:column;gap:18px}
  .logo{font-size:30px;font-weight:900;letter-spacing:.12em;text-align:center}
  .logo span:nth-child(1){color:var(--B)} .logo span:nth-child(2){color:var(--I)} .logo span:nth-child(3){color:var(--N)}
  .logo span:nth-child(4){color:var(--G)} .logo span:nth-child(5){color:var(--O)}
  .logo small{display:block;font-size:14px;letter-spacing:.1em;color:var(--dim);margin-top:4px}
  label{font-size:13px;color:var(--dim);display:block;margin-bottom:6px}
  #code{width:100%;font:inherit;font-size:30px;font-weight:800;padding:12px;border-radius:14px;border:2px solid var(--line);
    background:#0a0d1c;color:#fff;letter-spacing:.15em;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace}
  .seg{display:flex;background:#0a0d1c;border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px}
  .seg button{flex:1;border:none;background:transparent;color:var(--dim);font-size:15px;padding:10px 4px;border-radius:10px}
  .seg button.on{background:var(--panel2);color:#fff;box-shadow:inset 0 0 0 2px var(--accent)}
  #go{background:var(--accent);border-color:var(--accent);color:#0e1124;font-size:20px;padding:16px}
  #setupMsg{min-height:20px;font-size:14px;color:var(--ng);text-align:center}
  .note{font-size:12px;color:var(--dim);line-height:1.7}

  /* ===== 操作画面 ===== */
  #run{display:none}
  #run.show{display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:100%}
  .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel)}
  #dot{width:12px;height:12px;border-radius:50%;background:var(--dim);flex:none}
  #dot.ok{background:var(--ok)} #dot.ng{background:var(--ng)} #dot.wait{background:var(--accent)}
  #statusText{font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:10px;flex:none}
  .icon svg{width:22px;height:22px}
  .icon.on{border-color:var(--accent);color:var(--accent)}

  #topArea{display:flex;flex-direction:column}
  #preview{position:relative;height:24vh;min-height:120px;background:#000}
  #preview video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #run.nopreview #preview{display:none}
  .now{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:2px solid var(--panel)}
  .ball{min-width:72px;height:44px;padding:0 12px;border-radius:22px;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:24px;background:var(--panel);border:3px solid var(--line);font-variant-numeric:tabular-nums}
  .count{font-size:13px;color:var(--dim)} .count b{color:var(--accent);font-size:20px}
  .now .sp{flex:1}
  .now button{font-size:13px;padding:8px 10px}
  #reset.armed{border-color:var(--ng);color:var(--ng)}
  #drawBtn{display:none;background:var(--accent);border-color:var(--accent);color:#0e1124;font-size:15px;padding:8px 14px}
  #run.appmode #drawBtn{display:block}
  #run.appmode .now{flex-wrap:wrap}
  #run.appmode #drawBtn{order:10;flex:1 1 100%;padding:12px;font-size:18px}
  .ball,.count,.now button{white-space:nowrap}
  #drawBtn:disabled{opacity:.5}
  #run.nocam #preview, #run.nocam #togglePreview{display:none}

  #inputArea{display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;gap:6px;padding:8px 12px 0}
  .tabs button{flex:1;font-size:14px;padding:8px;border-radius:10px 10px 0 0;border-bottom:none;color:var(--dim);background:transparent}
  .tabs button.on{background:var(--panel);color:#fff;border-color:var(--panel)}
  .pane{flex:1;min-height:0;display:none;background:var(--panel);margin:0 12px;border-radius:0 0 12px 12px;padding:8px}
  .pane.on{display:flex;flex-direction:column}

  /* 一覧（ビンゴカードと同じ縦の列） */
  #grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;align-content:start}
  #grid .hd{position:sticky;top:0;z-index:1;font-weight:900;font-size:18px;text-align:center;padding:4px 0;border-radius:8px;color:#0e1124}
  #grid .c{height:36px;border-radius:8px;border:none;background:#0a0d1c;color:#cfd3f5;font-size:17px;font-weight:700;
    font-variant-numeric:tabular-nums;padding:0}
  #grid .c.done{background:var(--ng);color:#fff;opacity:.55}
  #grid .c.last{background:var(--accent);color:#0e1124;opacity:1}
  #grid .c.sel{box-shadow:inset 0 0 0 3px #fff;background:#3a4380;color:#fff}

  /* テンキー */
  .keys{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px}
  .keys button{font-size:30px;font-weight:800;min-height:48px;background:#0a0d1c}

  /* 下：入力中の番号＋表示ボタン */
  .send{display:flex;gap:10px;align-items:stretch;padding:10px 12px 12px}
  #entry{flex:1;min-height:60px;border-radius:14px;background:#0a0d1c;border:2px solid var(--line);display:flex;align-items:center;
    justify-content:center;gap:10px;font-size:36px;font-weight:900;font-variant-numeric:tabular-nums}
  #entry .ltr{font-size:20px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0e1124}
  #entry .ph{font-size:14px;font-weight:400;color:var(--dim)}
  #send{width:38%;max-width:200px;background:var(--accent);border-color:var(--accent);color:#0e1124;font-size:22px}
  #send:disabled{background:var(--panel);border-color:var(--line);color:var(--dim);opacity:1}
  #msg{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(0,0,0,.85);
    padding:10px 16px;border-radius:12px;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
  #msg.show{opacity:1}
  #run.off #inputArea, #run.off .send, #run.off .now button{opacity:.35;pointer-events:none}

  /* 配置切替ボタン */
  #layoutBtn{width:auto;padding:0 10px;font-size:13px;gap:4px}

  /* ===== 横向きレイアウト（body.land）：左に入力、右にプレビューと送信 ===== */
  body.land #run.show{grid-template-columns:minmax(0,1fr) clamp(220px,32vw,320px);grid-template-rows:auto minmax(0,1fr) auto}
  body.land .bar{grid-column:1 / 3;padding:4px 10px}
  body.land .bar .icon{width:34px;height:34px}
  body.land #inputArea{grid-row:2 / 4;grid-column:1;padding-bottom:8px}
  body.land .tabs{padding:6px 10px 0}
  body.land .tabs button{padding:5px;font-size:13px}
  body.land .pane{margin:0 10px}
  body.land #topArea{grid-row:2;grid-column:2;min-height:0;padding:8px 10px 0 0}
  body.land #preview{flex:1;height:auto;min-height:0;border-radius:10px;overflow:hidden}
  body.land .now{flex-wrap:wrap;padding:8px 0;gap:8px;border-bottom:none}
  body.land .now .sp{display:none}
  body.land .now .ball{min-width:0;flex:1 1 50%;height:40px;font-size:22px;white-space:nowrap}
  body.land .now .count{flex:0 0 auto;white-space:nowrap}
  body.land .now button{flex:1 1 40%;padding:8px 4px;white-space:nowrap}
  body.land #drawBtn{flex:1 1 100%;order:-1;padding:12px;font-size:18px}
  body.land .send{grid-row:3;grid-column:2;flex-direction:column;gap:8px;padding:0 10px 10px 0}
  body.land #entry{min-height:52px;font-size:30px;flex:none}
  body.land #send{width:100%;max-width:none;height:60px;flex:none}
  body.land #run.nopreview #topArea{grid-row:2}
  /* 一覧はビンゴ画面と同じ横長：B〜Oが行、1〜15が列（スクロールなしで全部見える） */
  body.land #grid{grid-template-columns:30px repeat(15,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));overflow:hidden;gap:3px}
  body.land #grid .hd{position:static;display:flex;align-items:center;justify-content:center;padding:0;font-size:16px}
  body.land #grid .c{height:auto;font-size:clamp(12px,2.1vw,17px);border-radius:6px}
  body.land .keys{grid-template-columns:repeat(4,1fr)}
  body.land .keys button{font-size:26px;min-height:0}

  /* 設定シート */
  #sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
  #sheet.show{display:flex}
  .sheet-inner{width:100%;max-width:520px;margin:0 auto;background:var(--panel2);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:14px}
  .sheet-inner h3{margin:0;font-size:17px}
  .sheet-inner .codeinfo{font-size:13px;color:var(--dim)} .sheet-inner .codeinfo b{color:var(--accent);letter-spacing:.15em}
  #stop{background:var(--ng);border-color:var(--ng);padding:14px;font-size:16px}
  #closeSheet{padding:12px;font-size:15px}
</style>
</head>
<body>

<!-- ===== 開始画面 ===== -->
<div id="setup" class="screen show">
  <div class="setup-inner">
    <div class="logo"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span><small>カメラ＆入力</small></div>
    <div>
      <label>接続コード（ビンゴ画面の設定に出ている8文字）</label>
      <input id="code" maxlength="9" placeholder="xxxx-xxxx" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div>
      <label>カメラ</label>
      <div class="seg" id="segFacing">
        <button data-v="environment" class="on">外カメラ</button><button data-v="user">内カメラ</button><button data-v="none">使わない</button>
      </div>
    </div>
    <div>
      <label>画質</label>
      <div class="seg" id="segQuality">
        <button data-v="640x480">軽い</button><button data-v="1280x720" class="on">標準 720p</button><button data-v="1920x1080">高画質</button>
      </div>
    </div>
    <button id="go">カメラ開始</button>
    <div id="setupMsg"></div>
    <div class="note">スマホとPCを同じWi-Fiにつないでください。配信中はこの画面を開いたままにしてください（スリープしないようにしています）。</div>
  </div>
</div>

<!-- ===== 操作画面 ===== -->
<div id="run" class="screen off">
  <div class="bar">
    <div id="dot"></div><div id="statusText">接続中…</div>
    <button class="icon" id="layoutBtn" title="画面の配置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M2 9v6M22 9v6"/></svg>
      <span id="layoutLabel">自動</span>
    </button>
    <button class="icon on" id="togglePreview" title="プレビュー">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="icon" id="openSheet" title="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
    </button>
  </div>

  <div id="topArea">
    <div id="preview"></div>
    <div class="now">
      <div class="ball" id="lastBall">-</div>
      <div class="count"><b id="count">0</b> 個目</div>
      <div class="sp"></div>
      <button id="drawBtn">🎲 抽選</button>
      <button id="undo">取り消し</button>
      <button id="reset">リセット</button>
    </div>
  </div>

  <div id="inputArea">
    <div class="tabs">
      <button data-tab="grid" class="on">一覧</button><button data-tab="keys">テンキー</button>
    </div>
    <div class="pane on" id="pane-grid"><div id="grid"></div></div>
    <div class="pane" id="pane-keys">
      <div class="keys">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="clr">C</button><button data-k="0">0</button><button data-k="del">⌫</button>
      </div>
    </div>
  </div>

  <div class="send">
    <div id="entry"></div>
    <button id="send" disabled>表示</button>
  </div>
</div>

<!-- 設定シート -->
<div id="sheet">
  <div class="sheet-inner">
    <h3>設定</h3>
    <div class="codeinfo">接続コード <b id="sheetCode"></b></div>
    <div>
      <label>カメラ</label>
      <div class="seg" id="segFacing2">
        <button data-v="environment" class="on">外カメラ</button><button data-v="user">内カメラ</button><button data-v="none">使わない</button>
      </div>
    </div>
    <div>
      <label>画質</label>
      <div class="seg" id="segQuality2">
        <button data-v="640x480">軽い</button><button data-v="1280x720" class="on">標準 720p</button><button data-v="1920x1080">高画質</button>
      </div>
    </div>
    <button id="stop">停止して最初の画面に戻る</button>
    <button id="closeSheet">閉じる</button>
  </div>
</div>

<div id="msg"></div>

<script>
const $ = id => document.getElementById(id);
const CODE_KEY = "obs-bingo-cam-code", PREF_KEY = "obs-bingo-cam-pref";
const PREFIX = "obsbingo-";
const MAX = 75, LETTERS = ["B","I","N","G","O"];
const COLORS = {B:"var(--B)",I:"var(--I)",N:"var(--N)",G:"var(--G)",O:"var(--O)"};
const letterOf = n => LETTERS[Math.floor((n-1)/15)];
let stream = null, peer = null, call = null, data = null;
let running = false, retryTimer = null, wakeLock = null;
let entry = "", drawn = [], resetArmed = 0;
let pref = {facing:"environment", quality:"1280x720", preview:true, tab:"grid"};
try{ Object.assign(pref, JSON.parse(localStorage.getItem(PREF_KEY) || "{}")); }catch(e){}
const savePref = () => { try{ localStorage.setItem(PREF_KEY, JSON.stringify(pref)); }catch(e){} };

// ---- 開始画面 ----
const qCode = new URLSearchParams(location.search).get("code");
// 接続コード：英小文字＋数字 8文字（xxxx-xxxx）。大文字・空白・ハイフンの有無は気にせず入れられる
const CODE_RE = /^[a-hjkmnp-z2-9]{4}-[a-hjkmnp-z2-9]{4}$/;
function normCode(v){
  const s = String(v || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 8);
  return s.length > 4 ? s.slice(0,4) + "-" + s.slice(4) : s;
}
let savedCode = ""; try{ savedCode = localStorage.getItem(CODE_KEY) || ""; }catch(e){}
$("code").value = CODE_RE.test(normCode(qCode)) ? normCode(qCode) : (CODE_RE.test(savedCode) ? savedCode : "");
$("code").addEventListener("input", e => { e.target.value = normCode(e.target.value); });

function bindSeg(ids, key, onChange){
  const sync = () => ids.forEach(id => $(id).querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === pref[key])));
  ids.forEach(id => $(id).querySelectorAll("button").forEach(b => b.onclick = async () => {
    if(pref[key] === b.dataset.v) return;
    pref[key] = b.dataset.v; savePref(); sync();
    if(onChange) await onChange();
  }));
  sync();
}
function updateGoLabel(){ $("go").textContent = pref.facing === "none" ? "接続する（カメラなし）" : "カメラ開始"; }
function applyNoCam(){ $("run").classList.toggle("nocam", !stream); }
const reopen = async () => {
  updateGoLabel();
  if(!running) return;
  if(pref.facing === "none"){   // カメラをやめて、操作だけの接続にする
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
    const c = call; call = null; try{ c?.close(); }catch(e){}
    $("preview").innerHTML = ""; applyNoCam();
    if(data && data.open) setStatus("つながっています（カメラなし）", "ok");
    return;
  }
  try{ const had = !!stream; await openCamera(); applyNoCam(); if(!had) connect(); }
  catch(e){ flash("カメラを開けませんでした"); }
};
bindSeg(["segFacing","segFacing2"], "facing", reopen);
bindSeg(["segQuality","segQuality2"], "quality", reopen);

function setStatus(text, state){ $("statusText").textContent = text; $("dot").className = state || ""; }
let msgTimer;
function flash(text){ const m = $("msg"); m.textContent = text; m.classList.add("show"); clearTimeout(msgTimer); msgTimer = setTimeout(()=>m.classList.remove("show"), 2200); }
function setOnline(on){ $("run").classList.toggle("off", !on); }

// ---- 一覧（縦向き：B〜Oが列 / 横向き：B〜Oが行） ----
const grid = $("grid");
LETTERS.forEach((L,c) => { const h = document.createElement("div"); h.className = "hd"; h.textContent = L; h.style.background = COLORS[L];
  h.dataset.r = 0; h.dataset.c = c; grid.appendChild(h); });
for(let r = 1; r <= 15; r++){
  for(let c = 0; c < 5; c++){
    const n = c*15 + r, b = document.createElement("button");
    b.className = "c"; b.id = "g" + n; b.textContent = n; b.dataset.r = r; b.dataset.c = c;
    b.onclick = () => {
      if(drawn.includes(n)){ flash(`${letterOf(n)} ${n} はもう出ています`); return; }
      entry = entry === String(n) ? "" : String(n);   // もう一度タップで選択解除
      drawEntry();
    };
    grid.appendChild(b);
  }
}
// ---- テンキー ----
document.querySelectorAll(".keys button").forEach(btn => btn.addEventListener("click", () => {
  const k = btn.dataset.k;
  if(k === "del") entry = entry.slice(0,-1);
  else if(k === "clr") entry = "";
  else if(entry.length < 2) entry = (entry === "0" ? "" : entry) + k;
  else entry = k;   // 2桁入っている状態で押したら打ち直し
  drawEntry();
}));
// ---- タブ ----
function setTab(t){
  pref.tab = t; savePref();
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + t));
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
setTab(pref.tab === "keys" ? "keys" : "grid");

function validEntry(){ const n = parseInt(entry, 10); return n>=1 && n<=MAX && !drawn.includes(n) ? n : 0; }
function drawEntry(){
  const e = $("entry"), n = parseInt(entry, 10);
  if(!entry) e.innerHTML = '<span class="ph">番号を選んでください</span>';
  else{
    const L = n>=1 && n<=MAX ? letterOf(n) : null;
    e.innerHTML = (L ? `<span class="ltr" style="background:${COLORS[L]}">${L}</span>` : "") + `<span>${entry}</span>`;
  }
  $("send").disabled = !validEntry();
  document.querySelectorAll("#grid .c.sel").forEach(x => x.classList.remove("sel"));
  if(n>=1 && n<=MAX) $("g"+n)?.classList.add("sel");
}
function drawState(){
  const last = drawn[drawn.length-1], b = $("lastBall");
  b.textContent = last ? `${letterOf(last)} ${last}` : "-";
  b.style.borderColor = last ? COLORS[letterOf(last)] : "var(--line)";
  $("count").textContent = drawn.length;
  for(let n = 1; n <= MAX; n++){
    const g = $("g"+n); g.classList.toggle("done", drawn.includes(n)); g.classList.toggle("last", n === last);
  }
  if(entry && drawn.includes(parseInt(entry,10))) entry = "";
  drawEntry();
}
function send(msg){ if(data && data.open){ data.send(msg); return true; } flash("ビンゴ画面とつながっていません"); return false; }
$("send").onclick = () => {
  const n = parseInt(entry, 10);
  if(!(n>=1 && n<=MAX)){ flash(`1〜${MAX}で入力してね`); return; }
  if(drawn.includes(n)){ flash(`${n} はもう出ています`); return; }
  if(send({type:"add", n})){ entry = ""; drawEntry(); if(navigator.vibrate) navigator.vibrate(30); }
};
$("undo").onclick = () => { if(!drawn.length){ flash("取り消す番号がありません"); return; } send({type:"undo"}); };
$("reset").onclick = () => {
  const now = Date.now(), r = $("reset");
  if(now - resetArmed < 3000){ resetArmed = 0; r.classList.remove("armed"); r.textContent = "リセット"; send({type:"reset"}); }
  else{
    resetArmed = now; r.classList.add("armed"); r.textContent = "もう一度";
    setTimeout(() => { if(Date.now() - resetArmed >= 3000){ r.classList.remove("armed"); r.textContent = "リセット"; } }, 3100);
  }
};

// ---- プレビュー表示切替・設定シート ----
function applyPreview(){ $("run").classList.toggle("nopreview", !pref.preview); $("togglePreview").classList.toggle("on", pref.preview); }
$("togglePreview").onclick = () => { pref.preview = !pref.preview; savePref(); applyPreview(); };
applyPreview();

// ---- 画面の配置：自動 / 縦 / 横 ----
const LAYOUTS = ["auto","portrait","landscape"], LAYOUT_LABEL = {auto:"自動", portrait:"縦", landscape:"横"};
if(!LAYOUTS.includes(pref.layout)) pref.layout = "auto";
function applyLayout(){
  const land = pref.layout === "landscape" || (pref.layout === "auto" && innerWidth > innerHeight);
  document.body.classList.toggle("land", land);
  $("layoutLabel").textContent = LAYOUT_LABEL[pref.layout];
  $("layoutBtn").classList.toggle("on", pref.layout !== "auto");
  // 一覧の並び：縦はカードと同じ（列=B〜O）、横はビンゴ画面と同じ（行=B〜O）
  grid.querySelectorAll("[data-r]").forEach(el => {
    const r = +el.dataset.r, c = +el.dataset.c;
    el.style.gridRow = land ? (c + 1) : (r + 1);
    el.style.gridColumn = land ? (r + 1) : (c + 1);
  });
}
$("layoutBtn").onclick = () => {
  pref.layout = LAYOUTS[(LAYOUTS.indexOf(pref.layout) + 1) % LAYOUTS.length]; savePref(); applyLayout();
  flash(`画面の配置：${LAYOUT_LABEL[pref.layout]}${pref.layout === "auto" ? "（スマホの向きに合わせる）" : ""}`);
};
addEventListener("resize", applyLayout);
applyLayout();
$("openSheet").onclick = () => { $("sheetCode").textContent = $("code").value; $("sheet").classList.add("show"); };
$("closeSheet").onclick = () => $("sheet").classList.remove("show");
$("sheet").onclick = e => { if(e.target.id === "sheet") $("sheet").classList.remove("show"); };

// ---- カメラ ----
async function openCamera(){
  const [w,h] = pref.quality.split("x").map(Number);
  const s = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ideal:pref.facing}, width:{ideal:w}, height:{ideal:h}, frameRate:{ideal:30} }, audio:false
  });
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = s;
  let v = $("preview").querySelector("video");
  if(!v){ v = document.createElement("video"); v.autoplay = true; v.muted = true; v.playsInline = true; $("preview").appendChild(v); }
  v.srcObject = stream;
  const sender = call?.peerConnection?.getSenders().find(x => x.track && x.track.kind === "video");
  if(sender) await sender.replaceTrack(stream.getVideoTracks()[0]);
}

// ---- 接続 ----
function scheduleRetry(msg){
  if(!running) return;
  setStatus(msg + "（再接続します）", "ng");
  setOnline(false);
  clearTimeout(retryTimer);
  retryTimer = setTimeout(connect, 3000);
}
function openData(target){
  if(data){ try{ data.close(); }catch(e){} }
  const d = data = peer.connect(target, {reliable:true});
  d.on("open", () => { if(data === d){ setOnline(true); setStatus(stream ? "配信中" : "つながっています（カメラなし）", "ok"); } });
  d.on("data", m => {
    if(data !== d || !m || typeof m !== "object") return;
    if(m.type === "state" && Array.isArray(m.drawn)){
      drawn = m.drawn; drawState();
      $("run").classList.toggle("appmode", m.mode === "app");
      $("drawBtn").disabled = !!m.spinning;
    }
    else if(m.type === "msg" && m.text) flash(m.text);
    else if(m.type === "rejected"){
      // ロック中・PC側で切断 → 再接続を繰り返さずに止める
      stop();
      $("setupMsg").textContent = m.reason === "kicked"
        ? "ビンゴ画面側で切断されました"
        : "ビンゴ画面は別のスマホとつながっているため接続できません（ロック中）";
    }
  });
  d.on("close", () => { if(data === d){ setOnline(false); if(!call) scheduleRetry("ビンゴ画面が切断しました"); } });
}
function connect(){
  if(!running) return;
  clearTimeout(retryTimer);
  const target = PREFIX + $("code").value;
  if(!peer || peer.destroyed){
    setStatus("サーバーに接続中…", "wait");
    peer = new Peer();
    peer.on("open", () => connect());
    peer.on("error", err => {
      if(err.type === "peer-unavailable") scheduleRetry("ビンゴ画面が見つかりません。コードとOBSを確認");
      else if(["network","server-error","socket-error","socket-closed","disconnected"].includes(err.type)){
        try{ peer.destroy(); }catch(e){}
        scheduleRetry("サーバーにつながりません");
      } else scheduleRetry("エラー：" + err.type);
    });
    peer.on("disconnected", () => { try{ peer.reconnect(); }catch(e){} });
    return;
  }
  if(!peer.open) return;
  if(call){ try{ call.close(); }catch(e){} call = null; }
  setStatus("ビンゴ画面につないでいます…", "wait");
  if(!stream){ openData(target); return; }   // カメラなし：操作だけつなぐ
  const c = peer.call(target, stream);
  if(!c){ scheduleRetry("接続できませんでした"); return; }
  call = c;
  openData(target);
  const pc = c.peerConnection;
  if(pc) pc.addEventListener("iceconnectionstatechange", () => {
    if(call !== c) return;
    const st = pc.iceConnectionState;
    if(st === "connected" || st === "completed") setStatus("配信中", "ok");
    else if(st === "failed" || st === "closed") scheduleRetry("接続が切れました");
    else if(st === "disconnected"){
      setStatus("通信が不安定です…", "wait");
      setTimeout(() => { if(call === c && pc.iceConnectionState === "disconnected") scheduleRetry("接続が切れました"); }, 5000);
    }
  });
  c.on("close", () => { if(call === c) scheduleRetry("ビンゴ画面が切断しました"); });
  c.on("error", () => { if(call === c) scheduleRetry("接続エラー"); });
}

async function keepAwake(){
  try{ if("wakeLock" in navigator && running && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") keepAwake(); });

function showScreen(id){ ["setup","run"].forEach(s => $(s).classList.toggle("show", s === id)); }

async function start(){
  const code = normCode($("code").value), m = $("setupMsg");
  $("code").value = code;
  m.textContent = "";
  if(!CODE_RE.test(code)){ m.textContent = "8文字の接続コードを入れてください（例：ab3k-9xqz）"; $("code").focus(); return; }
  if(!window.Peer){ m.textContent = "接続ライブラリを読み込めませんでした。ページを再読み込みしてください"; return; }
  const useCam = pref.facing !== "none";
  if(useCam && !navigator.mediaDevices?.getUserMedia){ m.textContent = "このブラウザではカメラが使えません（https で開いているか確認）。カメラを「使わない」にすると操作だけできます"; return; }
  try{ localStorage.setItem(CODE_KEY, code); }catch(e){}
  $("go").disabled = true;
  if(useCam){
    try{ await openCamera(); }
    catch(e){ m.textContent = "カメラを開けませんでした。ブラウザのカメラ許可を確認してください"; $("go").disabled = false; return; }
  }
  applyNoCam();
  $("go").disabled = false;
  running = true;
  setOnline(false);
  showScreen("run");
  keepAwake();
  connect();
}
function stop(){
  running = false; clearTimeout(retryTimer);
  if(data){ try{ data.close(); }catch(e){} data = null; }
  if(call){ try{ call.close(); }catch(e){} call = null; }
  if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
  try{ wakeLock?.release(); }catch(e){}
  $("preview").innerHTML = "";
  $("sheet").classList.remove("show");
  showScreen("setup");
}
$("drawBtn").onclick = () => { if(send({type:"draw"})){ $("drawBtn").disabled = true; if(navigator.vibrate) navigator.vibrate(30); } };
$("go").onclick = start;
updateGoLabel();
$("stop").onclick = stop;
drawEntry(); drawState();
</script>

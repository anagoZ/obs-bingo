<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Bingo Display</title>
<style>
  :root{
    --bg:#0e1124; --panel:#171c38; --line:#2a3160;
    --accent:#ffcc33; --hit:#ff4d6d; --text:#ffffff; --dim:#58609a;
    --B:#3fa7ff; --I:#ff5e7e; --N:#c9c9d6; --G:#3fd68a; --O:#ffb13f;
  }
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:var(--text)}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
  #left{position:absolute;left:0;top:0;width:806px;z-index:1;height:1080px;box-sizing:border-box;
    padding:40px 44px;background:var(--bg);display:flex;flex-direction:column;gap:26px}

  /* 右側：枠の中だけ透明。枠の外は背景色で隠す */
  #right{position:absolute;left:800px;top:0;width:1120px;height:1080px;overflow:hidden;
    box-shadow:-4px 0 0 var(--bg)}
  #frame{position:absolute;box-shadow:0 0 0 4000px var(--bg);outline:6px solid var(--line);overflow:hidden}
  #frame video{width:100%;height:100%;object-fit:cover;display:block}

  .title{display:flex;justify-content:space-between;align-items:baseline}
  .title h1{margin:0;font-size:56px;letter-spacing:.18em;font-weight:900}
  .title h1 span:nth-child(1){color:var(--B)} .title h1 span:nth-child(2){color:var(--I)}
  .title h1 span:nth-child(3){color:var(--N)} .title h1 span:nth-child(4){color:var(--G)}
  .title h1 span:nth-child(5){color:var(--O)}
  .count{font-size:30px;color:#cfd3f5}
  .count b{font-size:44px;color:var(--accent);margin:0 4px}

  #current{position:relative;height:400px;border-radius:28px;background:var(--panel);
    display:flex;align-items:center;justify-content:center;gap:30px;overflow:hidden}
  #curLetter{font-size:130px;font-weight:900;width:150px;height:150px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;background:var(--dim);color:#0e1124}
  #curNum{font-size:300px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
    text-shadow:0 8px 0 rgba(0,0,0,.35)}
  #curNum.empty{font-size:80px;color:var(--dim);text-shadow:none}
  .pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

  #history{display:flex;gap:12px;height:76px;align-items:center}
  #history .lbl{font-size:22px;color:#9aa0d0;width:70px;flex:none}
  #history .h{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:32px;font-weight:800;background:var(--panel);border:4px solid var(--line)}

  #board{display:grid;grid-template-columns:46px repeat(15,1fr);gap:5px;flex:1;align-content:start}
  #board .rowlbl{font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#0e1124}
  #board .cell{height:58px;border-radius:8px;background:var(--panel);color:var(--dim);
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;cursor:pointer;
    font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
  #board .cell.on{background:var(--hit);color:#fff}
  #board .cell.last{background:var(--accent);color:#0e1124}

  #typing{position:absolute;left:44px;bottom:28px;font-size:22px;color:#9aa0d0;opacity:0;transition:opacity .2s}
  #typing.show{opacity:1}
  #typing b{color:var(--accent);font-size:34px;margin-left:8px}
  #toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 26px;border-radius:14px;
    background:rgba(0,0,0,.8);font-size:30px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1}

  /* 右下のボタン（設定・リセット） */
  #tools{position:absolute;right:44px;bottom:22px;display:flex;gap:14px}
  #tools button{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--panel);
    color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
    transition:color .2s,border-color .2s}
  #tools button:hover{color:#fff;border-color:#fff}
  #tools button.armed{color:var(--hit);border-color:var(--hit)}
  #tools svg{width:28px;height:28px}

  /* 設定パネル（S キーで開閉） */
  #settings{position:absolute;left:1000px;top:200px;width:720px;box-sizing:border-box;padding:36px 40px;
    background:#1d2347;border:3px solid var(--accent);border-radius:24px;font-size:26px;display:none;z-index:10;
    box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #settings.open{display:block}
  #settings h2{margin:0 0 20px;font-size:34px}
  #settings .presets{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
  #settings button{font:inherit;font-size:22px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);
    background:var(--panel);color:#fff;cursor:pointer}
  #settings button.sel{border-color:var(--accent);color:var(--accent)}
  #settings .custom{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  #settings input{font:inherit;width:140px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);
    background:#0e1124;color:#fff;text-align:center}
  #settings .info{background:#0e1124;border-radius:14px;padding:18px 22px;font-size:22px;line-height:1.7}
  #settings .info b{color:var(--accent);font-variant-numeric:tabular-nums}
  #settings .hint{margin-top:16px;font-size:18px;color:#9aa0d0}
</style>
</head>
<body>
<div id="stage">
<div id="left">
  <div class="title">
    <h1><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></h1>
    <div class="count"><b id="cnt">0</b>個目 / 75</div>
  </div>
  <div id="current">
    <div id="curLetter">?</div>
    <div id="curNum" class="empty">READY</div>
    <div id="toast"></div>
  </div>
  <div id="history"><div class="lbl">履歴</div></div>
  <div id="board"></div>
  <div id="typing">入力中:<b id="buf"></b></div>
  <div id="tools">
    <button id="btnSettings" title="設定（S）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button id="btnReset" title="リセット（Shift+R）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 3 3 9 9 9"/></svg>
    </button>
  </div>
</div>
<div id="right"><div id="frame"></div></div>

<div id="settings">
  <h2>カメラの解像度</h2>
  <div class="presets" id="presets"></div>
  <div class="custom">
    <input id="resW" type="number" min="1"> × <input id="resH" type="number" min="1">
    <button id="applyRes">適用</button>
  </div>
  <div class="info">
    OBSでのカメラの置き場所（右クリック →「変換」→「変換の編集」）<br>
    位置 X <b id="iX"></b> / Y <b id="iY"></b><br>
    サイズ 幅 <b id="iW"></b> × 高さ <b id="iH"></b>
  </div>
  <div class="hint">
    ショートカット：数字→Enter 表示 ／ Backspace 1つ取り消し ／ Esc 入力クリア ／ Shift+R×2 リセット ／ S 設定<br>
    S キー・Esc・歯車ボタンで閉じる（開いている間は配信にも映ります）
  </div>
</div>
</div>

<script>
const MAX = 75;
const LETTERS = ["B","I","N","G","O"];
const COLORS = {B:"var(--B)",I:"var(--I)",N:"var(--N)",G:"var(--G)",O:"var(--O)"};
const KEY = "obs-bingo-v1";
const RES_KEY = "obs-bingo-res";
const PRESETS = [
  ["16:9 横",1920,1080],["4:3 横",1440,1080],["1:1",1080,1080],["3:4 縦",1080,1440],["9:16 縦",1080,1920]
];
let drawn = [];   // 出た順
let buf = "";
let resetArmed = 0;
let res = {w:1920,h:1080};
let scale = 1;

const $ = id => document.getElementById(id);
const letterOf = n => LETTERS[Math.floor((n-1)/15)];

// ---- 保存（OBSのリロードでも消えないように） ----
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(drawn)); }catch(e){} }
function load(){
  try{ const v = JSON.parse(localStorage.getItem(KEY)||"[]");
       if(Array.isArray(v)) drawn = v.filter(n=>Number.isInteger(n)&&n>=1&&n<=MAX); }catch(e){}
  try{ const r = JSON.parse(localStorage.getItem(RES_KEY)||"null");
       if(r && r.w>0 && r.h>0) res = {w:+r.w,h:+r.h}; }catch(e){}
  // URLで指定もできる： bingo.html?res=1280x720
  const q = new URLSearchParams(location.search).get("res");
  const m = q && q.match(/^(\d+)[x×:](\d+)$/i);
  if(m && +m[1]>0 && +m[2]>0) res = {w:+m[1],h:+m[2]};
}

// ---- 盤面生成 ----
const board = $("board");
LETTERS.forEach((L,r)=>{
  const lb = document.createElement("div");
  lb.className="rowlbl"; lb.textContent=L; lb.style.background=COLORS[L];
  board.appendChild(lb);
  for(let c=1;c<=15;c++){
    const n = r*15+c, d = document.createElement("div");
    d.className="cell"; d.id="c"+n; d.textContent=n;
    d.onclick=()=> drawn.includes(n) ? removeNum(n) : addNum(n);
    board.appendChild(d);
  }
});

function render(animate){
  const last = drawn[drawn.length-1];
  $("cnt").textContent = drawn.length;
  for(let n=1;n<=MAX;n++){
    const el=$("c"+n);
    el.classList.toggle("on", drawn.includes(n));
    el.classList.toggle("last", n===last);
  }
  const ln=$("curLetter"), cn=$("curNum");
  if(last){
    const L=letterOf(last);
    ln.textContent=L; ln.style.background=COLORS[L];
    cn.textContent=last; cn.classList.remove("empty");
  }else{
    ln.textContent="?"; ln.style.background="var(--dim)";
    cn.textContent="READY"; cn.classList.add("empty");
  }
  if(animate){ [ln,cn].forEach(e=>{e.classList.remove("pop"); void e.offsetWidth; e.classList.add("pop");}); }
  const h=$("history");
  h.querySelectorAll(".h").forEach(e=>e.remove());
  drawn.slice(0,-1).slice(-8).reverse().forEach(n=>{
    const d=document.createElement("div"); d.className="h"; d.textContent=n;
    d.style.borderColor=COLORS[letterOf(n)]; h.appendChild(d);
  });
}

function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1400);
}
function addNum(n){
  if(!(n>=1&&n<=MAX)){ toast(`1〜${MAX}で入力してね`); return; }
  if(drawn.includes(n)){ toast(`${n} はもう出ています`); return; }
  drawn.push(n); save(); render(true);
}
function removeNum(n){ drawn=drawn.filter(x=>x!==n); save(); render(false); }
function showBuf(){
  $("buf").textContent=buf;
  $("typing").classList.toggle("show", buf.length>0);
}

// ---- カメラ枠：解像度の比率に合わせて右側に配置 ----
const RIGHT_X = 800, RIGHT_W = 1120, RIGHT_H = 1080, MARGIN = 30;
let frameBox = {x:0,y:0,w:0,h:0};
function layoutFrame(){
  const a = res.w/res.h, aw = RIGHT_W-MARGIN*2, ah = RIGHT_H-MARGIN*2;
  const w = Math.min(aw, ah*a), h = w/a;
  const x = (RIGHT_W-w)/2, y = (RIGHT_H-h)/2;
  frameBox = {x:RIGHT_X+x, y, w, h};
  Object.assign($("frame").style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px"});
  updateInfo();
}
function updateInfo(){
  const r = v => Math.round(v*scale);
  $("iX").textContent=r(frameBox.x); $("iY").textContent=r(frameBox.y);
  $("iW").textContent=r(frameBox.w); $("iH").textContent=r(frameBox.h);
  $("resW").value=res.w; $("resH").value=res.h;
  document.querySelectorAll("#presets button").forEach(b=>
    b.classList.toggle("sel", +b.dataset.w*res.h === +b.dataset.h*res.w));
}
function setRes(w,h){
  if(!(w>0&&h>0)){ toast("幅と高さを入れてね"); return; }
  res={w,h}; try{ localStorage.setItem(RES_KEY, JSON.stringify(res)); }catch(e){}
  layoutFrame();
}
PRESETS.forEach(([label,w,h])=>{
  const b=document.createElement("button"); b.textContent=`${label}（${w}×${h}）`;
  b.dataset.w=w; b.dataset.h=h; b.onclick=()=>setRes(w,h);
  $("presets").appendChild(b);
});
$("applyRes").onclick=()=>setRes(parseInt($("resW").value,10), parseInt($("resH").value,10));
function toggleSettings(force){
  const s=$("settings"), open = force ?? !s.classList.contains("open");
  s.classList.toggle("open", open);
  if(!open) document.activeElement?.blur();
}

// ---- キー操作 ----
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"){
    if(e.key==="Enter") $("applyRes").click();
    if(e.key==="Escape") toggleSettings(false);
    return;
  }
  if(e.key==="s"||e.key==="S"){ if(!e.shiftKey){ toggleSettings(); return; } }
  if(/^[0-9]$/.test(e.key)){ if(buf.length<2){ buf+=e.key; showBuf(); } return; }
  if(e.key==="Enter"){ if(buf){ addNum(parseInt(buf,10)); buf=""; showBuf(); } return; }
  if(e.key==="Escape"){ if($("settings").classList.contains("open")) toggleSettings(false); buf=""; showBuf(); return; }
  if(e.key==="Backspace"){
    e.preventDefault();
    if(buf){ buf=buf.slice(0,-1); showBuf(); }
    else if(drawn.length){ const n=drawn.pop(); save(); render(false); toast(`${n} を取り消しました`); }
    return;
  }
  if(e.key==="R" && e.shiftKey) requestReset("もう一度 Shift+R でリセット");
});

// ---- リセット（2回押しで確定） ----
function requestReset(msg){
  const now=Date.now(), btn=$("btnReset");
  if(now-resetArmed<2500){
    drawn=[]; save(); render(false); toast("リセットしました"); resetArmed=0; btn.classList.remove("armed");
  }else{
    resetArmed=now; toast(msg); btn.classList.add("armed");
    clearTimeout(requestReset._t); requestReset._t=setTimeout(()=>btn.classList.remove("armed"),2500);
  }
}
$("btnReset").onclick=e=>{ e.currentTarget.blur(); requestReset("もう一度押すとリセット"); };
$("btnSettings").onclick=e=>{ e.currentTarget.blur(); toggleSettings(); };

// ---- ブラウザで試すとき用：?cam=1 で枠の中にPCのカメラを表示 ----
if(new URLSearchParams(location.search).has("cam") && navigator.mediaDevices){
  navigator.mediaDevices.getUserMedia({video:{width:1920,height:1080},audio:false}).then(s=>{
    const v=document.createElement("video"); v.autoplay=true; v.muted=true; v.playsInline=true; v.srcObject=s;
    $("frame").appendChild(v);
  }).catch(()=>toast("カメラを開けませんでした"));
}

// ---- どの画面サイズでも1920×1080の比率で全体を収める ----
function fit(){
  scale=Math.min(innerWidth/1920, innerHeight/1080);
  $("stage").style.transform=`scale(${scale})`;
  updateInfo();
}
addEventListener("resize",fit);

load(); layoutFrame(); fit(); render(false);
</script>
</body>
</html>

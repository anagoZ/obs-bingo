<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Bingo Display</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#0e1124; --panel:#171c38; --line:#2a3160;
    --accent:#ffcc33; --hit:#ff4d6d; --text:#ffffff; --dim:#58609a;
    --B:#3fa7ff; --I:#ff5e7e; --N:#c9c9d6; --G:#3fd68a; --O:#ffb13f;
  }
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:var(--text)}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
  #left{position:absolute;left:0;top:0;width:806px;z-index:1;height:1080px;box-sizing:border-box;
    padding:40px 44px;background:var(--bg);display:flex;flex-direction:column;gap:26px}

  /* 右側：枠の中だけ透明。枠の外は背景色で隠す */
  #right{position:absolute;left:800px;top:0;width:1120px;height:1080px;overflow:hidden;
    box-shadow:-4px 0 0 var(--bg)}
  #frame{position:absolute;box-shadow:0 0 0 4000px var(--bg);outline:6px solid var(--line);overflow:hidden}
  #frame video{width:100%;height:100%;object-fit:cover;display:block}
  /* アプリ内抽選モード：カメラ枠の代わりに画面上のガラガラ */
  #drum{position:absolute;inset:0;display:none}
  body.app #drum{display:block}
  body.app #frame{display:none}
  body.app #right{background:var(--bg)}
  #btnDraw{display:none !important}
  body.app #btnDraw{display:flex !important}
  #btnDraw.busy{color:var(--accent) !important;border-color:var(--accent) !important}
  .modeRow{display:flex;align-items:center;gap:20px;margin-bottom:22px;padding-bottom:22px;border-bottom:2px solid var(--line)}
  .modeRow h2{margin:0 !important}
  .modeRow .seg{display:flex;gap:10px}
  .modeRow .seg button.sel{border-color:var(--accent);color:var(--accent)}
  .modeRow .desc{font-size:18px;color:#9aa0d0}

  .title{display:flex;justify-content:space-between;align-items:baseline}
  .title h1{margin:0;font-size:56px;letter-spacing:.18em;font-weight:900}
  .title h1 span:nth-child(1){color:var(--B)} .title h1 span:nth-child(2){color:var(--I)}
  .title h1 span:nth-child(3){color:var(--N)} .title h1 span:nth-child(4){color:var(--G)}
  .title h1 span:nth-child(5){color:var(--O)}
  .count{font-size:30px;color:#cfd3f5}
  .count b{font-size:44px;color:var(--accent);margin:0 4px}

  #current{position:relative;height:400px;border-radius:28px;background:var(--panel);
    display:flex;align-items:center;justify-content:center;gap:30px;overflow:hidden}
  #curLetter{font-size:130px;font-weight:900;width:150px;height:150px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;background:var(--dim);color:#0e1124}
  #curNum{font-size:300px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
    text-shadow:0 8px 0 rgba(0,0,0,.35)}
  #curNum.empty{font-size:80px;color:var(--dim);text-shadow:none}
  .pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

  #history{display:flex;gap:12px;height:76px;align-items:center}
  #history .lbl{font-size:22px;color:#9aa0d0;width:70px;flex:none}
  #history .h{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:32px;font-weight:800;background:var(--panel);border:4px solid var(--line)}

  #board{display:grid;grid-template-columns:46px repeat(15,1fr);gap:5px;flex:1;align-content:start}
  #board .rowlbl{font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#0e1124}
  #board .cell{height:58px;border-radius:8px;background:var(--panel);color:var(--dim);
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;cursor:pointer;
    font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
  #board .cell.on{background:var(--hit);color:#fff}
  #board .cell.last{background:var(--accent);color:#0e1124}

  #typing{position:absolute;left:44px;bottom:28px;font-size:22px;color:#9aa0d0;opacity:0;transition:opacity .2s}
  #typing.show{opacity:1}
  #typing b{color:var(--accent);font-size:34px;margin-left:8px}
  #toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 26px;border-radius:14px;
    background:rgba(0,0,0,.8);font-size:30px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1}

  /* 右下のボタン（設定・リセット） */
  #tools{position:absolute;right:44px;bottom:22px;display:flex;gap:14px}
  #tools button{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--panel);
    color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
    transition:color .2s,border-color .2s}
  #tools button:hover{color:#fff;border-color:#fff}
  #tools button.armed{color:var(--hit);border-color:var(--hit)}
  #tools svg{width:28px;height:28px}

  /* 設定パネル（S キーで開閉） */
  #settings{position:absolute;left:120px;top:50%;transform:translateY(-50%);width:1680px;max-height:1030px;overflow-y:auto;
    box-sizing:border-box;padding:30px 40px;
    background:#1d2347;border:3px solid var(--accent);border-radius:24px;font-size:26px;display:none;z-index:10;
    box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #settings .cols{display:grid;grid-template-columns:1fr 1fr;gap:48px}
  #settings .cols > section + section{border-left:2px solid var(--line);padding-left:48px}
  #settings.open{display:block}
  #settings h2{margin:0 0 14px;font-size:30px}
  #settings .presets{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
  #settings button{font:inherit;font-size:22px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);
    background:var(--panel);color:#fff;cursor:pointer}
  #settings button.sel{border-color:var(--accent);color:var(--accent)}
  #settings .custom{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  #settings input{font:inherit;width:140px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);
    background:#0e1124;color:#fff;text-align:center}
  #settings .info{background:#0e1124;border-radius:14px;padding:14px 20px;font-size:20px;line-height:1.6}
  #settings .info b{color:var(--accent);font-variant-numeric:tabular-nums}
  #settings .hint{margin-top:16px;font-size:18px;color:#9aa0d0}
  #settings hr{border:none;border-top:2px solid var(--line);margin:18px 0}
  .phone{display:flex;gap:28px;align-items:center}
  #qr{width:200px;height:200px;background:#fff;padding:10px;border-radius:12px;flex:none}
  #qr img,#qr canvas{width:200px !important;height:200px !important}
  .phone .code{font-size:22px;color:#cfd3f5}
  .phone .code b{display:block;font-size:54px;letter-spacing:.08em;white-space:nowrap;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.2}
  .phone .st{display:flex;align-items:center;gap:10px;font-size:22px;margin:10px 0 14px}
  #camDot{width:16px;height:16px;border-radius:50%;background:var(--dim)}
  #camDot.ok{background:#3fd68a} #camDot.wait{background:var(--accent)} #camDot.ng{background:var(--hit)}
  .phone label{font-size:20px;color:#cfd3f5;display:flex;align-items:center;gap:10px;cursor:pointer}
  #settings .phone label input{width:24px;height:24px;padding:0}
  #camLink{font-size:15px;color:#9aa0d0;word-break:break-all;margin-top:8px}
  /* QRとコードは普段は隠す（配信に映らないように） */
  #qrBox{position:relative;width:220px;height:220px;flex:none}
  #qrBox #qr{position:absolute;inset:0;visibility:hidden}
  #qrBox.shown #qr{visibility:visible}
  #revealBtn{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;border:3px dashed var(--line) !important;
    background:#0e1124 !important;font-size:20px !important;line-height:1.5;color:#cfd3f5 !important}
  #qrBox.shown #revealBtn{display:none}
  #revealNote{font-size:17px;color:var(--hit);min-height:24px;margin-top:6px}
  .phone .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .phone .btns button{font-size:18px !important}
</style>
</head>
<body>
<div id="stage">
<div id="left">
  <div class="title">
    <h1><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></h1>
    <div class="count"><b id="cnt">0</b>個目 / 75</div>
  </div>
  <div id="current">
    <div id="curLetter">?</div>
    <div id="curNum" class="empty">READY</div>
    <div id="toast"></div>
  </div>
  <div id="history"><div class="lbl">履歴</div></div>
  <div id="board"></div>
  <div id="typing">入力中:<b id="buf"></b></div>
  <div id="tools">
    <button id="btnDraw" title="抽選（Space）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="16" cy="8" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="8" cy="16" r="1.3" fill="currentColor"/><circle cx="16" cy="16" r="1.3" fill="currentColor"/></svg>
    </button>
    <button id="btnSettings" title="設定（S）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button id="btnReset" title="リセット（Shift+R）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 3 3 9 9 9"/></svg>
    </button>
  </div>
</div>
<div id="right"><div id="frame"></div><canvas id="drum" width="1120" height="1080"></canvas></div>

<div id="settings">
 <div class="modeRow">
  <h2>右側の表示</h2>
  <div class="seg">
    <button data-mode="camera">カメラ</button>
    <button data-mode="app">アプリ内抽選</button>
  </div>
  <div class="desc" id="modeDesc"></div>
 </div>
 <div class="cols">
 <section>
  <h2>スマホカメラ</h2>
  <div class="phone">
    <div id="qrBox">
      <div id="qr"></div>
      <button id="revealBtn">QRとコードを<br>表示する</button>
    </div>
    <div>
      <div class="code">スマホでQRを読むか、カメラ送信ページにこのコードを入力<b id="camCode">●●●●-●●●●</b></div>
      <div id="revealNote"></div>
      <div class="st"><div id="camDot"></div><div id="camStatus">準備中…</div></div>
      <label><input type="checkbox" id="lockChk" checked> つながったスマホ以外は受け付けない（ロック）</label>
      <label style="margin-top:8px"><input type="checkbox" id="autoFit" checked> スマホの映像に枠の比率を合わせる</label>
      <div class="btns">
        <button id="kick">今のスマホを切断</button>
        <button id="newCode">コードを変える</button>
      </div>
      <div id="camLink"></div>
    </div>
  </div>
 </section>
 <section>
  <h2>カメラの解像度</h2>
  <div class="presets" id="presets"></div>
  <div class="custom">
    <input id="resW" type="number" min="1"> × <input id="resH" type="number" min="1">
    <button id="applyRes">適用</button>
  </div>
  <div class="info">
    OBSのカメラソースを使う場合の置き場所（右クリック →「変換」→「変換の編集」）<br>
    位置 X <b id="iX"></b> / Y <b id="iY"></b><br>
    サイズ 幅 <b id="iW"></b> × 高さ <b id="iH"></b>
  </div>
 </section>
 </div>
  <div class="hint">
    ショートカット：数字→Enter 表示 ／ Space 抽選（アプリ内抽選のとき） ／ Backspace 1つ取り消し ／ Esc 入力クリア ／ Shift+R×2 リセット ／ S 設定<br>
    S キー・Esc・歯車ボタンで閉じる（開いている間は配信にも映ります）
  </div>
</div>
</div>

<script>
const MAX = 75;
const LETTERS = ["B","I","N","G","O"];
const COLORS = {B:"var(--B)",I:"var(--I)",N:"var(--N)",G:"var(--G)",O:"var(--O)"};
const KEY = "obs-bingo-v1";
const RES_KEY = "obs-bingo-res";
const PRESETS = [
  ["16:9 横",1920,1080],["4:3 横",1440,1080],["1:1",1080,1080],["3:4 縦",1080,1440],["9:16 縦",1080,1920]
];
let drawn = [];   // 出た順
let buf = "";
let resetArmed = 0;
let res = {w:1920,h:1080};
let scale = 1;

const $ = id => document.getElementById(id);
const letterOf = n => LETTERS[Math.floor((n-1)/15)];

// ---- 保存（OBSのリロードでも消えないように） ----
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(drawn)); }catch(e){} }
function load(){
  try{ const v = JSON.parse(localStorage.getItem(KEY)||"[]");
       if(Array.isArray(v)) drawn = v.filter(n=>Number.isInteger(n)&&n>=1&&n<=MAX); }catch(e){}
  try{ const r = JSON.parse(localStorage.getItem(RES_KEY)||"null");
       if(r && r.w>0 && r.h>0) res = {w:+r.w,h:+r.h}; }catch(e){}
  // URLで指定もできる： bingo.html?res=1280x720
  const q = new URLSearchParams(location.search).get("res");
  const m = q && q.match(/^(\d+)[x×:](\d+)$/i);
  if(m && +m[1]>0 && +m[2]>0) res = {w:+m[1],h:+m[2]};
}

// ---- 盤面生成 ----
const board = $("board");
LETTERS.forEach((L,r)=>{
  const lb = document.createElement("div");
  lb.className="rowlbl"; lb.textContent=L; lb.style.background=COLORS[L];
  board.appendChild(lb);
  for(let c=1;c<=15;c++){
    const n = r*15+c, d = document.createElement("div");
    d.className="cell"; d.id="c"+n; d.textContent=n;
    d.onclick=()=> drawn.includes(n) ? removeNum(n) : addNum(n);
    board.appendChild(d);
  }
});

function render(animate){
  const last = drawn[drawn.length-1];
  $("cnt").textContent = drawn.length;
  for(let n=1;n<=MAX;n++){
    const el=$("c"+n);
    el.classList.toggle("on", drawn.includes(n));
    el.classList.toggle("last", n===last);
  }
  const ln=$("curLetter"), cn=$("curNum");
  if(last){
    const L=letterOf(last);
    ln.textContent=L; ln.style.background=COLORS[L];
    cn.textContent=last; cn.classList.remove("empty");
  }else{
    ln.textContent="?"; ln.style.background="var(--dim)";
    cn.textContent="READY"; cn.classList.add("empty");
  }
  if(animate){ [ln,cn].forEach(e=>{e.classList.remove("pop"); void e.offsetWidth; e.classList.add("pop");}); }
  const h=$("history");
  h.querySelectorAll(".h").forEach(e=>e.remove());
  drawn.slice(0,-1).slice(-8).reverse().forEach(n=>{
    const d=document.createElement("div"); d.className="h"; d.textContent=n;
    d.style.borderColor=COLORS[letterOf(n)]; h.appendChild(d);
  });
  broadcast();
  syncBalls();
}

function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1400);
}
function addNum(n){
  if(!(n>=1&&n<=MAX)){ toast(`1〜${MAX}で入力してね`); return; }
  if(drawn.includes(n)){ toast(`${n} はもう出ています`); return; }
  drawn.push(n); save(); render(true);
}
function removeNum(n){ drawn=drawn.filter(x=>x!==n); save(); render(false); }
function showBuf(){
  $("buf").textContent=buf;
  $("typing").classList.toggle("show", buf.length>0);
}

// ---- カメラ枠：解像度の比率に合わせて右側に配置 ----
const RIGHT_X = 800, RIGHT_W = 1120, RIGHT_H = 1080, MARGIN = 30;
let frameBox = {x:0,y:0,w:0,h:0};
function layoutFrame(){
  const a = res.w/res.h, aw = RIGHT_W-MARGIN*2, ah = RIGHT_H-MARGIN*2;
  const w = Math.min(aw, ah*a), h = w/a;
  const x = (RIGHT_W-w)/2, y = (RIGHT_H-h)/2;
  frameBox = {x:RIGHT_X+x, y, w, h};
  Object.assign($("frame").style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px"});
  updateInfo();
}
function updateInfo(){
  const r = v => Math.round(v*scale);
  $("iX").textContent=r(frameBox.x); $("iY").textContent=r(frameBox.y);
  $("iW").textContent=r(frameBox.w); $("iH").textContent=r(frameBox.h);
  $("resW").value=res.w; $("resH").value=res.h;
  document.querySelectorAll("#presets button").forEach(b=>
    b.classList.toggle("sel", +b.dataset.w*res.h === +b.dataset.h*res.w));
}
function setRes(w,h){
  if(!(w>0&&h>0)){ toast("幅と高さを入れてね"); return; }
  res={w,h}; try{ localStorage.setItem(RES_KEY, JSON.stringify(res)); }catch(e){}
  layoutFrame();
}
PRESETS.forEach(([label,w,h])=>{
  const b=document.createElement("button"); b.textContent=`${label}（${w}×${h}）`;
  b.dataset.w=w; b.dataset.h=h; b.onclick=()=>setRes(w,h);
  $("presets").appendChild(b);
});
$("applyRes").onclick=()=>setRes(parseInt($("resW").value,10), parseInt($("resH").value,10));
function toggleSettings(force){
  const s=$("settings"), open = force ?? !s.classList.contains("open");
  s.classList.toggle("open", open);
  if(!open){ document.activeElement?.blur(); if(typeof setRevealed === "function") setRevealed(false); }
}

// ---- キー操作 ----
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"){
    if(e.key==="Enter") $("applyRes").click();
    if(e.key==="Escape") toggleSettings(false);
    return;
  }
  if(e.key==="s"||e.key==="S"){ if(!e.shiftKey){ toggleSettings(); return; } }
  if(/^[0-9]$/.test(e.key)){ if(buf.length<2){ buf+=e.key; showBuf(); } return; }
  if(e.key==="Enter"){ if(buf){ addNum(parseInt(buf,10)); buf=""; showBuf(); } return; }
  if(e.key==="Escape"){ if($("settings").classList.contains("open")) toggleSettings(false); buf=""; showBuf(); return; }
  if(e.key==="Backspace"){
    e.preventDefault();
    if(buf){ buf=buf.slice(0,-1); showBuf(); }
    else if(drawn.length){ const n=drawn.pop(); save(); render(false); toast(`${n} を取り消しました`); }
    return;
  }
  if(e.key==="R" && e.shiftKey) requestReset("もう一度 Shift+R でリセット");
  if(e.key===" " || e.code==="Space"){ e.preventDefault(); if(mode==="app") drawRandom(); else toast("Space の抽選は「アプリ内抽選」のときに使えます"); }
});

// ---- リセット（2回押しで確定） ----
function requestReset(msg){
  const now=Date.now(), btn=$("btnReset");
  if(now-resetArmed<2500){
    drawn=[]; save(); render(false); toast("リセットしました"); resetArmed=0; btn.classList.remove("armed");
  }else{
    resetArmed=now; toast(msg); btn.classList.add("armed");
    clearTimeout(requestReset._t); requestReset._t=setTimeout(()=>btn.classList.remove("armed"),2500);
  }
}
$("btnReset").onclick=e=>{ e.currentTarget.blur(); requestReset("もう一度押すとリセット"); };
$("btnSettings").onclick=e=>{ e.currentTarget.blur(); toggleSettings(); };

// ---- ブラウザで試すとき用：?cam=1 で枠の中にPCのカメラを表示 ----
if(new URLSearchParams(location.search).has("cam") && navigator.mediaDevices){
  navigator.mediaDevices.getUserMedia({video:{width:1920,height:1080},audio:false}).then(s=>{
    const v=document.createElement("video"); v.autoplay=true; v.muted=true; v.playsInline=true; v.srcObject=s;
    v.dataset.local="1"; $("frame").appendChild(v);
  }).catch(()=>toast("カメラを開けませんでした"));
}

// ---- スマホカメラ受信（camera.html から WebRTC で映像を受け取る） ----
const CAM_PAGE = "https://anagoz.github.io/obs-bingo/camera.html";
const CAM_CODE_KEY = "obs-bingo-recv-code", AUTOFIT_KEY = "obs-bingo-autofit", LOCK_KEY = "obs-bingo-lock";
const PEER_PREFIX = "obsbingo-";
const REVEAL_SECONDS = 60;
let camCode = "", peer = null, camCall = null, peerTimer = null;
let revealed = false, revealTimer = null, lockPeer = null;
const remotes = new Set();   // スマホからの数字入力の接続

// ---- QRとコードの表示（普段は隠し、押したときだけ一定時間表示） ----
function setRevealed(on){
  revealed = on; clearInterval(revealTimer);
  $("qrBox").classList.toggle("shown", on);
  drawQr();
  if(on){
    let left = REVEAL_SECONDS;
    const tick = () => {
      $("revealNote").textContent = `表示中は配信にも映ります（あと${left}秒で隠します）`;
      if(--left < 0) setRevealed(false);
    };
    tick(); revealTimer = setInterval(tick, 1000);
  }else $("revealNote").textContent = "";
}

// ---- ロック：つながっているスマホ以外を断る ----
function sessionActive(){ return !!camCall || [...remotes].some(c => c.open); }
function refuse(peerId){ return $("lockChk").checked && lockPeer && peerId !== lockPeer && sessionActive(); }
function claim(peerId){ if(!lockPeer || !sessionActive()) lockPeer = peerId; }
function releaseIfIdle(){ if(!sessionActive()) lockPeer = null; }
function rejectConn(conn, reason){
  const bye = () => { try{ conn.send({type:"rejected", reason}); }catch(e){} setTimeout(() => { try{ conn.close(); }catch(e){} }, 800); };
  if(conn.open) bye(); else conn.on("open", bye);
}
function connectedText(){ return "スマホとつながっています" + ($("lockChk").checked ? "（ロック中）" : ""); }

function stateMsg(){ return {type:"state", drawn, mode, spinning: drumState.phase !== "idle"}; }
function broadcast(){
  for(const c of remotes){ try{ if(c.open) c.send(stateMsg()); }catch(e){} }
}
function onRemote(conn, m){
  if(!m || typeof m !== "object") return;
  const reply = text => { try{ conn.send({type:"msg", text}); }catch(e){} };
  if(m.type === "add"){
    const n = parseInt(m.n, 10);
    if(!(n>=1 && n<=MAX)) return reply(`1〜${MAX}で入力してね`);
    if(drawn.includes(n)) return reply(`${n} はもう出ています`);
    addNum(n); reply(`${letterOf(n)} ${n} を表示しました`);
  }else if(m.type === "undo"){
    if(!drawn.length) return reply("取り消す番号がありません");
    const n = drawn.pop(); save(); render(false); toast(`${n} を取り消しました`); reply(`${n} を取り消しました`);
  }else if(m.type === "draw"){
    if(mode !== "app") return reply("ビンゴ画面が「アプリ内抽選」になっていません");
    const r = drawRandom();
    if(r === "busy") reply("抽選中です");
    else if(r === "empty") reply("75個すべて出ました");
  }else if(m.type === "reset"){
    drawn = []; save(); render(false); toast("リセットしました"); reply("リセットしました");
  }
}
function acceptRemote(conn){
  remotes.add(conn);
  conn.on("open", () => { try{ conn.send(stateMsg()); }catch(e){} });
  conn.on("data", m => onRemote(conn, m));
  const drop = () => { remotes.delete(conn); releaseIfIdle(); };
  conn.on("close", drop); conn.on("error", drop);
}

// 接続コード：見間違えやすい文字（0,o,1,l,i）を除いた英小文字＋数字 8文字（約8,500億通り）
const CODE_CHARS = "abcdefghjkmnpqrstuvwxyz23456789";
const CODE_RE = /^[a-hjkmnp-z2-9]{4}-[a-hjkmnp-z2-9]{4}$/;
function newCamCode(){
  const r = new Uint32Array(8); crypto.getRandomValues(r);
  const s = Array.from(r, x => CODE_CHARS[x % CODE_CHARS.length]).join("");
  return s.slice(0,4) + "-" + s.slice(4);
}
function camPageUrl(){
  // スマホでカメラを使うには https が必須。OBSのローカルファイル（http://absolute/...）などでは公開ページを使う
  const base = location.protocol === "https:" ? new URL("camera.html", location.href).href : CAM_PAGE;
  return base + "?code=" + camCode;
}
function setCam(text, state){ $("camStatus").textContent = text; $("camDot").className = state || ""; }
function drawQr(){
  $("qr").innerHTML = "";
  if(!revealed){ $("camCode").textContent = "●●●●-●●●●"; $("camLink").textContent = ""; return; }
  $("camCode").textContent = camCode;
  $("camLink").textContent = camPageUrl();
  if(window.QRCode) new QRCode($("qr"), {text: camPageUrl(), width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M});
  else $("qr").textContent = "QRを表示できません";
}
function showRemote(stream){
  $("frame").querySelectorAll("video").forEach(v => v.remove());
  const v = document.createElement("video");
  v.autoplay = true; v.muted = true; v.playsInline = true; v.srcObject = stream;
  const fitToVideo = () => { if($("autoFit").checked && v.videoWidth && v.videoHeight) setRes(v.videoWidth, v.videoHeight); };
  v.addEventListener("loadedmetadata", fitToVideo);
  v.addEventListener("resize", fitToVideo);   // スマホの向きが変わったとき
  $("frame").appendChild(v);
  v.play().catch(()=>{});
}
function clearRemote(){ $("frame").querySelectorAll("video").forEach(v => { if(v.dataset.local !== "1") v.remove(); }); }
function retryPeer(msg){
  setCam(msg, "ng");
  clearTimeout(peerTimer);
  peerTimer = setTimeout(startPeer, 5000);
}
function startPeer(){
  clearTimeout(peerTimer);
  if(!window.Peer){ setCam("接続ライブラリを読み込めません（ネット接続を確認）", "ng"); return; }
  if(peer){ try{ peer.destroy(); }catch(e){} }
  setCam("サーバーに接続中…", "wait");
  const p = peer = new Peer(PEER_PREFIX + camCode);
  p.on("open", () => { if(peer === p && !camCall) setCam("スマホからの接続を待っています", "wait"); });
  p.on("call", call => {
    if(peer !== p) return;
    if(refuse(call.peer)){ try{ call.close(); }catch(e){} toast("別のスマホからの接続を断りました（ロック中）"); return; }
    claim(call.peer);
    if(camCall){ try{ camCall.close(); }catch(e){} }
    camCall = call;
    call.answer();
    call.on("stream", s => { if(camCall === call){ showRemote(s); setCam(connectedText(), "ok"); setRevealed(false); toast("スマホのカメラにつながりました"); } });
    const lost = () => { if(camCall === call){ camCall = null; clearRemote(); releaseIfIdle(); setCam("切断されました。スマホからの接続を待っています", "wait"); } };
    call.on("close", lost);
    call.on("error", lost);
    const pc = call.peerConnection;
    if(pc) pc.addEventListener("iceconnectionstatechange", () => {
      if(pc.iceConnectionState === "failed" || pc.iceConnectionState === "closed") lost();
    });
  });
  p.on("connection", conn => {
    if(peer !== p) return;
    if(refuse(conn.peer)){ rejectConn(conn, "locked"); return; }
    claim(conn.peer); acceptRemote(conn);
  });
  p.on("disconnected", () => { if(peer === p){ try{ p.reconnect(); }catch(e){} } });
  p.on("error", err => {
    if(peer !== p) return;
    if(err.type === "unavailable-id") retryPeer("前の接続が残っています。再接続中…");
    else if(["network","server-error","socket-error","socket-closed"].includes(err.type)) retryPeer("サーバーに再接続中…");
  });
}
function initCam(){
  try{ camCode = localStorage.getItem(CAM_CODE_KEY) || ""; }catch(e){}
  if(!CODE_RE.test(camCode)){ camCode = newCamCode(); try{ localStorage.setItem(CAM_CODE_KEY, camCode); }catch(e){} }
  try{ const a = localStorage.getItem(AUTOFIT_KEY); if(a !== null) $("autoFit").checked = a === "1"; }catch(e){}
  $("autoFit").onchange = e => { try{ localStorage.setItem(AUTOFIT_KEY, e.target.checked ? "1" : "0"); }catch(_){}
    const v = $("frame").querySelector("video"); if(e.target.checked && v?.videoWidth) setRes(v.videoWidth, v.videoHeight); };
  try{ const l = localStorage.getItem(LOCK_KEY); if(l !== null) $("lockChk").checked = l === "1"; }catch(e){}
  $("lockChk").onchange = e => {
    try{ localStorage.setItem(LOCK_KEY, e.target.checked ? "1" : "0"); }catch(_){}
    if(camCall) setCam(connectedText(), "ok");
  };
  // 今つながっているスマホを切断（スマホ側は自動再接続せずに止まる）
  const kickAll = reason => {
    for(const c of remotes) rejectConn(c, reason);
    if(camCall){ const c = camCall; camCall = null; setTimeout(() => { try{ c.close(); }catch(_){} }, 300); clearRemote(); }
    lockPeer = null;
  };
  $("kick").onclick = e => {
    e.currentTarget.blur();
    if(!sessionActive()){ toast("つながっているスマホはありません"); return; }
    kickAll("kicked"); setCam("切断しました。スマホからの接続を待っています", "wait"); toast("スマホを切断しました");
  };
  $("revealBtn").onclick = e => { e.currentTarget.blur(); setRevealed(true); };
  $("newCode").onclick = e => {
    e.currentTarget.blur();
    kickAll("kicked");
    camCode = newCamCode(); try{ localStorage.setItem(CAM_CODE_KEY, camCode); }catch(_){}
    setTimeout(() => { for(const c of remotes){ try{ c.close(); }catch(_){} } remotes.clear(); startPeer(); }, 900);
    setRevealed(true);
  };
  drawQr(); startPeer();
}

// ==== アプリ内抽選（画面上のガラガラ） ====
const MODE_KEY = "obs-bingo-mode";
const BALL_HEX = {B:"#3fa7ff", I:"#ff5e7e", N:"#c9c9d6", G:"#3fd68a", O:"#ffb13f"};
const DRUM = {cx:560, cy:410, R:330};           // ガラガラ本体
const TRAY = {x:560, y:905, r:112};             // 出た玉の受け皿
const SPIN_SEC = 2.4, FLY_SEC = 0.75, MAX_VISIBLE = 45, BALL_R = 27;
let mode = "camera";
let balls = [];                                 // {n,x,y,vx,vy}
const drumState = {phase:"idle", t:0, rot:0, omega:0, pick:0, shown:0, flyFrom:null};
let drumRAF = 0, drumLast = 0;
const drumCtx = $("drum").getContext("2d");

function remaining(){ const s = new Set(drawn); const r = []; for(let n=1;n<=MAX;n++) if(!s.has(n)) r.push(n); return r; }
function randInt(k){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % k; }
// 画面のガラガラの玉を「まだ出ていない番号」と合わせる（最大45個まで表示）
function syncBalls(){
  const rem = remaining(), remSet = new Set(rem);
  balls = balls.filter(b => remSet.has(b.n) && b.n !== drumState.pick);
  const target = Math.min(MAX_VISIBLE, rem.length - (drumState.phase === "idle" ? 0 : 1));
  const have = new Set(balls.map(b => b.n));
  const pool = rem.filter(n => !have.has(n) && n !== drumState.pick);
  while(balls.length < target && pool.length){
    const n = pool.splice(randInt(pool.length), 1)[0];
    const a = Math.random()*Math.PI*2, d = Math.random()*(DRUM.R-BALL_R*2);
    balls.push({n, x: DRUM.cx + Math.cos(a)*d*0.6, y: DRUM.cy + DRUM.R*0.35 + Math.sin(a)*d*0.3, vx:0, vy:0});
  }
  while(balls.length > target) balls.pop();
  if(drumState.shown && drawn[drawn.length-1] !== drumState.shown) drumState.shown = 0;
}
// 抽選する。戻り値: "ok" / "busy" / "empty"
function drawRandom(){
  if(drumState.phase !== "idle") return "busy";
  const rem = remaining();
  if(!rem.length){ toast("75個すべて出ました"); return "empty"; }
  drumState.pick = rem[randInt(rem.length)];
  drumState.phase = "spin"; drumState.t = 0; drumState.shown = 0;
  balls = balls.filter(b => b.n !== drumState.pick);   // 選ばれた玉は見えている中から抜く
  $("btnDraw").classList.add("busy");
  broadcast();
  return "ok";
}
function stepPhysics(dt){
  const {cx, cy, R} = DRUM, spin = drumState.phase === "spin";
  const g = 2200, wallV = drumState.omega * R;
  for(const b of balls){
    b.vy += g*dt;
    if(spin){ // 回転中は内壁に沿ってかき回す力
      const dx = b.x-cx, dy = b.y-cy, d = Math.hypot(dx,dy) || 1;
      const k = 2600 * (d/R);
      b.vx += (-dy/d)*k*dt; b.vy += (dx/d)*k*dt;
    }
    b.vx *= 0.996; b.vy *= 0.996;
    b.x += b.vx*dt; b.y += b.vy*dt;
    const dx = b.x-cx, dy = b.y-cy, d = Math.hypot(dx,dy) || 1, lim = R*Math.cos(Math.PI/8) - BALL_R - 8;
    if(d > lim){
      const nx = dx/d, ny = dy/d;
      b.x = cx + nx*lim; b.y = cy + ny*lim;
      const vn = b.vx*nx + b.vy*ny;
      if(vn > 0){ b.vx -= 1.55*vn*nx; b.vy -= 1.55*vn*ny; }
      // 壁の動きに少し引きずられる
      const tx = -ny, ty = nx, vt = b.vx*tx + b.vy*ty;
      const f = spin ? 0.18 : 0.06, dv = (wallV - vt) * f;
      b.vx += dv*tx; b.vy += dv*ty;
    }
  }
  for(let i=0;i<balls.length;i++) for(let j=i+1;j<balls.length;j++){
    const a = balls[i], c = balls[j], dx = c.x-a.x, dy = c.y-a.y, d2 = dx*dx+dy*dy, min = BALL_R*2;
    if(d2 < min*min && d2 > 0.01){
      const d = Math.sqrt(d2), nx = dx/d, ny = dy/d, push = (min-d)/2;
      a.x -= nx*push; a.y -= ny*push; c.x += nx*push; c.y += ny*push;
      const rel = (c.vx-a.vx)*nx + (c.vy-a.vy)*ny;
      if(rel < 0){ const imp = -rel*0.9; a.vx -= imp*nx/2; a.vy -= imp*ny/2; c.vx += imp*nx/2; c.vy += imp*ny/2; }
    }
  }
}
function drawBall(ctx, x, y, r, n, big){
  const L = letterOf(n), col = BALL_HEX[L];
  const grd = ctx.createRadialGradient(x - r*0.35, y - r*0.4, r*0.1, x, y, r);
  grd.addColorStop(0, "#ffffff"); grd.addColorStop(0.25, col); grd.addColorStop(1, shade(col, -0.35));
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = grd; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r*0.62, 0, Math.PI*2); ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.fill();
  ctx.fillStyle = "#0e1124"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if(big){
    ctx.font = `900 ${r*0.26}px "Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif`; ctx.fillText(L, x, y - r*0.3);
    ctx.font = `900 ${r*0.58}px "Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif`; ctx.fillText(n, x, y + r*0.1);
  }else{
    ctx.font = `800 ${r*0.62}px "Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif`; ctx.fillText(n, x, y + r*0.04);
  }
}
function shade(hex, p){
  const v = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(c + (p < 0 ? c : 255 - c) * p)));
  return `rgb(${f(v>>16)},${f((v>>8)&255)},${f(v&255)})`;
}
function drawDrum(){
  const ctx = drumCtx, {cx, cy, R} = DRUM;
  ctx.clearRect(0, 0, 1120, 1080);
  ctx.fillStyle = "#0e1124"; ctx.fillRect(0, 0, 1120, 1080);
  // 脚と受け皿への通り道
  ctx.strokeStyle = "#2a3160"; ctx.lineWidth = 26; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx - R*0.62, cy + R*0.72); ctx.lineTo(cx - R*0.95, 1040); ctx.moveTo(cx + R*0.62, cy + R*0.72); ctx.lineTo(cx + R*0.95, 1040); ctx.stroke();
  ctx.fillStyle = "#171c38"; ctx.fillRect(cx - 34, cy + R - 20, 68, TRAY.y - TRAY.r - (cy + R) + 40);
  // 受け皿
  ctx.beginPath(); ctx.arc(TRAY.x, TRAY.y, TRAY.r + 22, 0, Math.PI*2); ctx.fillStyle = "#171c38"; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = "#2a3160"; ctx.stroke();
  // 本体（八角形の籠）
  const octa = () => { ctx.beginPath(); for(let i=0;i<=8;i++){ const a = i*Math.PI/4 + Math.PI/8; const px = Math.cos(a)*R, py = Math.sin(a)*R; i ? ctx.lineTo(px,py) : ctx.moveTo(px,py); } };
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(drumState.rot); octa(); ctx.fillStyle = "rgba(23,28,56,.95)"; ctx.fill(); ctx.restore();
  for(const b of balls) drawBall(ctx, b.x, b.y, BALL_R, b.n, false);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(drumState.rot);
  ctx.lineWidth = 14; ctx.strokeStyle = "#ffcc33"; ctx.lineJoin = "round";
  ctx.beginPath();
  for(let i=0;i<=8;i++){ const a = i*Math.PI/4 + Math.PI/8; const px = Math.cos(a)*R, py = Math.sin(a)*R; i ? ctx.lineTo(px,py) : ctx.moveTo(px,py); }
  ctx.stroke();
  ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,204,51,.35)";
  for(let i=0;i<8;i++){ const a = i*Math.PI/4 + Math.PI/8; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*R, Math.sin(a)*R); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.fillStyle = "#ffcc33"; ctx.fill();
  ctx.restore();
  // 残り数
  ctx.fillStyle = "#9aa0d0"; ctx.font = `700 30px "Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif`; ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText(`のこり ${remaining().length} 個`, 40, 36);
  // 出てくる玉・出た玉
  if(drumState.phase === "fly"){
    const p = Math.min(1, drumState.t / FLY_SEC), e = easeOutBack(p);
    const y0 = cy + R - 10, x = TRAY.x, y = y0 + (TRAY.y - y0) * e, r = BALL_R + (TRAY.r - BALL_R) * Math.min(1, p*1.3);
    drawBall(ctx, x, y, r, drumState.pick, r > 60);
  }else if(drumState.shown){
    drawBall(ctx, TRAY.x, TRAY.y, TRAY.r, drumState.shown, true);
  }else{
    ctx.fillStyle = "#58609a"; ctx.font = `900 90px "Noto Sans JP",sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("?", TRAY.x, TRAY.y + 4);
  }
}
function easeOutBack(t){ const c1 = 1.4, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
function drumLoop(ts){
  const dt = Math.min(0.05, (ts - (drumLast || ts)) / 1000); drumLast = ts;
  const s = drumState;
  if(s.phase === "spin"){
    s.t += dt;
    const p = s.t / SPIN_SEC;
    s.omega = p < 0.2 ? 7*(p/0.2) : p > 0.8 ? 7*Math.max(0,(1-p)/0.2) : 7;   // 加速→一定→減速
    if(s.t >= SPIN_SEC){ s.phase = "fly"; s.t = 0; s.omega = 0; }
  }else if(s.phase === "fly"){
    s.t += dt;
    if(s.t >= FLY_SEC){
      s.phase = "idle"; s.shown = s.pick; const n = s.pick; s.pick = 0;
      $("btnDraw").classList.remove("busy");
      addNum(n);   // 左側に表示（スマホにも反映）
    }
  }else s.omega *= 0.9;
  s.rot += s.omega * dt;
  for(let i=0;i<2;i++) stepPhysics(dt/2);
  drawDrum();
  drumRAF = mode === "app" ? requestAnimationFrame(drumLoop) : 0;
}
function setMode(m){
  mode = m === "app" ? "app" : "camera";
  try{ localStorage.setItem(MODE_KEY, mode); }catch(e){}
  document.body.classList.toggle("app", mode === "app");
  document.querySelectorAll(".modeRow .seg button").forEach(b => b.classList.toggle("sel", b.dataset.mode === mode));
  $("modeDesc").textContent = mode === "app"
    ? "画面上のガラガラで抽選します（Space キー・🎲ボタン・スマホの「抽選」）"
    : "スマホやOBSのカメラでガラガラを映します";
  if(mode === "app"){ syncBalls(); if(!drumRAF){ drumLast = 0; drumRAF = requestAnimationFrame(drumLoop); } }
  else if(drumState.phase !== "idle"){ // 抽選中に切り替えたら、その番号はそのまま確定
    const n = drumState.pick; drumState.phase = "idle"; drumState.pick = 0; $("btnDraw").classList.remove("busy"); addNum(n);
  }
  broadcast();
}
document.querySelectorAll(".modeRow .seg button").forEach(b => b.onclick = e => { e.currentTarget.blur(); setMode(b.dataset.mode); });
$("btnDraw").onclick = e => { e.currentTarget.blur(); drawRandom(); };
function initMode(){ let m = "camera"; try{ m = localStorage.getItem(MODE_KEY) || "camera"; }catch(e){} setMode(m); }

// ---- どの画面サイズでも1920×1080の比率で全体を収める ----
function fit(){
  scale=Math.min(innerWidth/1920, innerHeight/1080);
  $("stage").style.transform=`scale(${scale})`;
  updateInfo();
}
addEventListener("resize",fit);

load(); layoutFrame(); fit(); render(false); initCam(); initMode();
</script>
